const panels={subtitle:'<div class="panelHead"><span>字幕设置</span><label><input id="subtitleEnabled" type="checkbox" checked> 启用字幕</label></div><button class="ghost" id="addSubtitle">+ 添加字幕</button><div class="lines" id="subtitleLines"></div><div class="field"><span>字体</span><select><option>思源黑体</option><option>思源宋体</option><option>霞鹜文楷</option><option>得意黑</option></select></div><div class="row"><label>颜色 <input id="fontColor" type="color" value="#ffffff"></label><label>字号 <input id="fontSize" type="number" value="28" style="width:70px"></label></div>',speed:'<div class="panelHead"><span>变速设置</span></div><div class="meta"><div><span>原始时长</span><b>12.0 秒</b></div><div><span>变速后</span><b id="speedDuration">10.0 秒</b></div></div><input id="speed" type="range" min="0.5" max="2" step="0.1" value="1.2">',transition:'<div class="panelHead"><span>转场特效</span></div><p>先选中视频片段，再选择转场特效。</p><input class="input" id="transitionSearch" placeholder="搜索转场"><div class="grid" id="transitions"></div>',bgm:'<div class="panelHead"><span>BGM库</span></div><button class="option active">轻快原声 · 12 秒</button><button class="option">店铺推广曲 · 8 秒</button><div class="field"><span>原声音量 <b id="volumeLabel">80%</b></span><input id="volume" type="range" min="0" max="100" value="80"></div>',mosaic:'<div class="panelHead"><span>马赛克</span><button class="ghost" id="addMosaic">+ 添加马赛克</button></div><p id="mosaicStatus">当前未添加马赛克。</p>',sticker:'<div class="panelHead"><span>贴纸</span></div><div class="grid"><button class="option" data-sticker="LOOK">LOOK</button><button class="option" data-sticker="BUY">BUY</button><button class="option" data-sticker="♥">♥</button></div>'};
const lines=['这款商品的细节给大家看一下','近距离看看面料和做工','日常搭配也很合适'];
const transitions=['淡入淡出','交叉缩放','圆形打开','万花筒','百叶窗','像素化','风车','爱心','涟漪'];
let tool='subtitle',playing=false,timer=null,progress=0,renderTimer=null;
function bindPanel(){document.querySelector('#addSubtitle')?.addEventListener('click',()=>{lines.push('新的字幕');renderPanel()});document.querySelectorAll('[data-line]').forEach(input=>input.oninput=()=>{lines[input.dataset.line]=input.value;document.querySelector('#subtitleOverlay').textContent=lines[0]||''});document.querySelectorAll('[data-delete-line]').forEach(button=>button.onclick=()=>{lines.splice(Number(button.dataset.deleteLine),1);renderPanel()});document.querySelector('#subtitleEnabled')?.addEventListener('change',event=>document.querySelector('#subtitleOverlay').classList.toggle('hidden',!event.target.checked));document.querySelector('#speed')?.addEventListener('input',event=>document.querySelector('#speedDuration').textContent=(12/Number(event.target.value)).toFixed(1)+' 秒');document.querySelector('#transitionSearch')?.addEventListener('input',renderTransitions);document.querySelectorAll('[data-transition]').forEach(button=>button.onclick=()=>{document.querySelectorAll('[data-transition]').forEach(item=>item.classList.remove('active'));button.classList.add('active')});document.querySelector('#volume')?.addEventListener('input',event=>document.querySelector('#volumeLabel').textContent=event.target.value+'%');document.querySelector('#addMosaic')?.addEventListener('click',()=>{document.querySelector('#mosaicOverlay').classList.remove('hidden');document.querySelector('#mosaicStatus').textContent='已添加马赛克 1'});document.querySelectorAll('[data-sticker]').forEach(button=>button.onclick=()=>{const sticker=document.querySelector('#stickerOverlay');sticker.textContent=button.dataset.sticker;sticker.classList.remove('hidden')})}
function renderLines(){document.querySelector('#subtitleLines').innerHTML=lines.map((line,index)=>'<div class="line"><span>'+(index+1)+'</span><input class="input" data-line="'+index+'" value="'+line+'"><button data-delete-line="'+index+'">删除</button></div>').join('');document.querySelector('#subtitleOverlay').textContent=lines[0]||''}
function renderTransitions(){const query=document.querySelector('#transitionSearch')?.value||'';document.querySelector('#transitions').innerHTML=transitions.filter(item=>item.includes(query)).map(item=>'<button class="option" data-transition="'+item+'">'+item+'</button>').join('')||'<p>暂无匹配转场</p>'}
function renderPanel(){document.querySelector('#config').innerHTML=panels[tool];document.querySelectorAll('[data-tool]').forEach(button=>button.classList.toggle('active',button.dataset.tool===tool));if(tool==='subtitle')renderLines();if(tool==='transition')renderTransitions();bindPanel()}
document.querySelectorAll('[data-tool]').forEach(button=>button.onclick=()=>{tool=button.dataset.tool;renderPanel()});
document.querySelector('#play').onclick=()=>{playing=!playing;document.querySelector('#play').textContent=playing?'暂停预览':'播放预览';clearInterval(timer);if(playing)timer=setInterval(()=>{progress=(progress+2)%100;document.querySelector('#playhead').style.left=progress+'%';document.querySelector('#timeLabel').textContent='00:'+String(Math.floor(progress*12/100)).padStart(2,'0')+'.0 / 00:12.0'},180)};
document.querySelector('#split').onclick=()=>document.querySelector('#timelineState').textContent='已在当前时间分割选中片段';
document.querySelector('#remove').onclick=()=>document.querySelector('#timelineState').textContent='至少保留一个视频片段';
document.querySelector('#fullscreen').onclick=()=>document.body.requestFullscreen?.();
document.querySelector('#download').onclick=()=>document.querySelector('#timelineState').textContent='导出草稿到剪映（原型演示）';
document.querySelector('#back').setAttribute('aria-label','返回成片编辑');
document.querySelector('#back').title='返回成片编辑';
document.querySelector('#back').onclick=()=>{const target=new URL(location.href);target.search='';location.href=target.href;};
document.querySelector('#next').onclick=()=>{const context=new URLSearchParams(location.search);const target=new URL(location.href);target.search='';target.searchParams.set('publish_task',context.get('task')||'131');target.searchParams.set('publish_clip',context.get('clip')||'0');target.searchParams.set('publish_from','online-edit');location.href=target.href;};
document.querySelector('#cancelRender').onclick=()=>{clearInterval(renderTimer);document.querySelector('#renderOverlay').classList.add('hidden');document.querySelector('#timelineState').textContent='已取消生成'};
renderPanel();
</script>
</body>
</html>
