</style><script>/* Each library card contains its own preview and subtitle editor. */
const inlineClipSubtitleDrafts = new Map();
const inlineSubtitleKey = item => 'live-slice-prototype-copy:subtitles:' + item.task.id + ':' + item.index;
const inlineSubtitleExamples = ['这款商品的细节给大家看一下','近距离看看面料和做工','日常搭配也很合适','这里是我们今天介绍的重点','可以根据自己的需要来选择','再给大家展示一下整体效果','商品信息可以在页面中查看','感兴趣的朋友可以了解一下'];

function inlineClipSubtitleState(item) {
  const key = inlineSubtitleKey(item);
  if (inlineClipSubtitleDrafts.has(key)) return inlineClipSubtitleDrafts.get(key);
  const clip = item.task.clips[item.index];
  let draft = {version:1,enabled:true,example:true,lines:[...inlineSubtitleExamples]}, error = '';
  if (Array.isArray(clip.subtitles)) draft = {version:1,enabled:true,example:false,lines:clip.subtitles.map(line => typeof line === 'string' ? line : String(line.text ?? ''))};
  try {
    const saved = JSON.parse(localStorage.getItem(key));
    if (saved && saved.version === 1 && typeof saved.enabled === 'boolean' && Array.isArray(saved.lines) && saved.lines.every(line => typeof line === 'string')) draft = {version:1,enabled:saved.enabled,example:saved.example === true,lines:[...saved.lines]};
  } catch { error = '未能读取本地字幕，请检查内容后再保存。'; }
  const state = {draft,savedSnapshot:JSON.stringify(draft),selected:0,message:error,error:!!error};
  inlineClipSubtitleDrafts.set(key,state);
  return state;
}

function renderInlineClipCard(item) {
  const clipKey = item.task.id + '-' + item.index;
  const selected = highlightSelectedClips.has(clipKey);
  const product = item.productId ? getManagedProducts(item.task.preset || currentDefaultPreset).find(product => product.id === item.productId) : null;
  const state = inlineClipSubtitleState(item), suffix = encodeURIComponent(clipKey);
  return `<article class="clip-card clip-editor-card${selected ? ' is-selected' : ''}" data-card-key="${escapeHtml(clipKey)}" data-inline-task="${escapeHtml(item.task.id)}" data-inline-clip="${item.index}" aria-label="视频">
    <header class="clip-editor-heading"><div class="clip-editor-product"><strong>${escapeHtml(product?.name || item.productId || '')}</strong><span class="clip-editor-duration">${escapeHtml(item.duration)}</span><span class="clip-editor-status${item.published ? ' published' : ''}">${item.published ? '已发布' : '未发布'}</span></div>${highlightBatchMode ? `<label class="clip-editor-select"><input type="checkbox" class="highlight-select" data-clip-key="${escapeHtml(clipKey)}" aria-label="选择视频 ${escapeHtml(item.clipNumber)}"${selected ? ' checked' : ''}>选择此视频</label>` : ''}</header>
    <div class="subtitle-editor-body clip-inline-body">
      <div class="subtitle-preview-pane"><div class="subtitle-preview-frame"><video class="clip-inline-video" poster="${escapeHtml(clipCover(item))}" preload="metadata" playsinline controls aria-label="视频预览"><source src="${escapeHtml(item.videoUrl || item.task.videoUrl || '')}" type="video/mp4"></video><img class="clip-inline-poster" src="${escapeHtml(clipCover(item))}" alt="当前视频的演示封面" loading="lazy" width="900" height="1600"><span class="subtitle-preview-label">视频预览</span><div class="subtitle-preview-copy"></div></div></div>
      <section class="subtitle-edit-pane" aria-label="${escapeHtml(item.clipNumber)} 字幕编辑">
        <div class="subtitle-edit-head"><div><h3>字幕设置</h3></div><label class="subtitle-switch"><input class="inline-subtitle-enabled" type="checkbox" ${state.draft.enabled ? 'checked' : ''}>启用字幕</label></div>
        <p id="inline-subtitle-hint-${suffix}" class="subtitle-editor-hint">${state.draft.example ? '当前为示例字幕，可逐条修改文字。' : '点击字幕可预览并修改文字，自动定位视频第一帧。'}</p>
        <div class="subtitle-edit-list" aria-describedby="inline-subtitle-hint-${suffix}"></div><div class="subtitle-save-status" role="status" aria-live="polite"></div>
        <div class="subtitle-edit-foot"><button type="button" class="reset inline-subtitle-edit">继续编辑</button><button type="button" class="subtitle-save-btn inline-subtitle-publish">前往发布</button><button type="button" class="reset inline-subtitle-export">导出草稿</button></div>
      </section>
    </div>
  </article>`;
}

function mountInlineClipEditors() {
  const items = new Map(allHighlightClips().map(item => [item.task.id + '-' + item.index,item]));
  document.querySelectorAll('.clip-editor-card[data-inline-task]').forEach(root => {
    const item = items.get(root.dataset.cardKey);
    if (!item) return;
    const state = inlineClipSubtitleState(item), list = root.querySelector('.subtitle-edit-list');
    const preview = root.querySelector('.subtitle-preview-copy'), status = root.querySelector('.subtitle-save-status');
    const video = root.querySelector('.clip-inline-video'), poster = root.querySelector('.clip-inline-poster');
    const drawStatus = () => { status.textContent = state.message; status.classList.toggle('is-error',state.error); };
    const resizeLine = input => { input.style.height = '0px'; input.style.height = Math.max(24,input.scrollHeight) + 'px'; };
    const updatePreview = () => {
      preview.textContent = state.draft.lines[state.selected] || '';

      list.querySelectorAll('.subtitle-item').forEach((row,i) => row.classList.toggle('is-active',i === state.selected));
      if (video && video.currentTime) { video.currentTime = 0; video.pause(); }
    };
    const markChanged = () => {
      state.error = false;
      state.message = JSON.stringify(state.draft) === state.savedSnapshot ? '' : '有未保存的修改';
      drawStatus();
      clearTimeout(state.autoSaveTimer);
      if (state.message) state.autoSaveTimer = setTimeout(() => {
        try {
          localStorage.setItem(inlineSubtitleKey(item),JSON.stringify(state.draft));

字幕”开始编辑。</p><button type="button" class="subtitle-add-btn" data-subtitle-add="-1">添加字幕</button></div>';
      list.querySelectorAll('[data-subtitle-line]').forEach(input => {
        resizeLine(input);
        input.onfocus = () => { state.selected = Number(input.dataset.subtitleLine); updatePreview(); };
        input.oninput = () => { state.selected = Number(input.dataset.subtitleLine); state.draft.lines[state.selected] = input.value; resizeLine(input); updatePreview(); markChanged(); };

}

// List-mode dialogs and the publication page share the same subtitle storage.
document.addEventListener('clip-subtitles-saved',event => {
  if (event.detail.origin === 'inline') return;
  const {taskId,index,enabled,lines} = event.detail;
  const key = 'live-slice-prototype-copy:subtitles:' + taskId + ':' + index;
  const state = inlineClipSubtitleDrafts.get(key);
  if (!state || !Array.isArray(lines)) return;
  let saved;
  try { saved = JSON.parse(localStorage.getItem(key)); } catch {}
  state.draft = {version:1,enabled,example:saved?.example === true,lines:[...lines]};
  state.savedSnapshot = JSON.stringify(state.draft); state.selected = 0; state.message = '已保存当前视频的字幕'; state.error = false;
});

</style><script>function materialSessionKey(task) {
  return String(task.liveSession && task.liveSession !== '待识别直播场次' ? task.liveSession : task.id);
}

let captureControlObserver;
function syncCaptureControlSize() {
  captureControlObserver?.disconnect();
  const config = document.querySelector('.highlight-auto-config');
  const button = document.getElementById('highlightUploadBtn');
  if (!config || !button) return;
  const update = () => button.style.setProperty('--capture-control-height', config.getBoundingClientRect().height + 'px');
  captureControlObserver = new ResizeObserver(update);
  captureControlObserver.observe(config); update();
}

function visibleUncutMaterialTasks() {
  const f = highlightClipFilters;
  return highlightTasks.filter(task => !task.clips.length)
    .filter(task => !f.taskId || String(task.id) === f.taskId)
    .filter(task => !f.date || task.created.startsWith(f.date))
    .filter(task => !f.productId || getTaskProductId(task) === f.productId)
    .filter(task => !f.hostName || String(task.hostName || '').toLowerCase().includes(f.hostName.toLowerCase()));
}

function openOriginalMaterials(session) {
  if (document.getElementById('originalMaterialsMask')) return;
  const task = highlightTasks.find(item => String(item.id) === String(session))
    || highlightTasks.find(item => session == null || materialSessionKey(item) === String(session));
  if (!task) { toast('这场直播暂无原始素材'); return; }
  let changed = false;
  const restoreFocus = document.activeElement;
  const shell = document.querySelector('.shell'), previousInert = shell.inert;

function clipDateLabel(value){const parts=String(value||'').split(' ');return parts[0]?parts[0].slice(5).replace('-','.')+' '+(parts[1]||'').slice(0,5):''}
function renderHighlightCards(list){
 const sessionHosts=new Map();allHighlightClips().forEach(item=>{const key=materialSessionKey(item.task),name=String(item.hostName||'').trim();if(!sessionHosts.has(key))sessionHosts.set(key,new Set());if(name)sessionHosts.get(key).add(name)});
 const sessions=new Map();list.forEach(item=>{const key=materialSessionKey(item.task);if(!sessions.has(key))sessions.set(key,[]);sessions.get(key).push(item)});
 visibleUncutMaterialTasks().filter(task=>String(task.liveStart||task.created).slice(0,10)===highlightDayPage).forEach(task=>{const key=materialSessionKey(task);if(!sessions.has(key))sessions.set(key,[])});
 sessions.forEach((items,session)=>{if(!expandedClipSessions.has(String(session)))collapsedClipSessions.add(String(session))});
 const groups=[...sessions.entries()].map(([session,items])=>{
  const task=items[0]?.task||highlightTasks.find(task=>materialSessionKey(task)===session),collapsed=collapsedClipSessions.has(String(session)),gridId='clip-session-grid-'+encodeURIComponent(session);
  const hostNames=[...(sessionHosts.get(session)||[])];
  const cards=items.length?items.map(renderInlineClipCard).join(''):'<div class="source-session-empty">暂无成片，可在原始录屏中查看素材与生成状态。</div>';
  const sessionTasks=highlightTasks.filter(task=>materialSessionKey(task)===session),sourceManual=sessionTasks.every(task=>task.manual),sourceMixed=!sourceManual&&sessionTasks.some(task=>task.manual),sourceLabel=sourceMixed?'自动 / 手动':sourceManual?'手动':'自动',sourceClass=sourceMixed?'mixed':sourceManual?'manual':'auto';
  return `<section class="clip-session${collapsed?' is-collapsed':''}" aria-label="直播场次 ${escapeHtml(session)}"><header class="clip-session-head"><strong>一场直播 · ${escapeHtml(task.liveStart.slice(0,10))}</strong><time>${escapeHtml(task.liveStart.slice(11,16))} — ${escapeHtml(task.liveEnd?task.liveEnd.slice(11,16):task.manual?'未记录':'进行中')}</time><span class="clip-session-source ${sourceClass}">${sourceLabel}</span><span class="clip-session-host">主播：${hostNames.length?hostNames.map(escapeHtml).join('、'):escapeHtml(task.hostName||'待识别')}</span><span class="clip-session-count">${items.length} 条成片</span><button class="clip-session-preview" data-preview-live="${escapeHtml(task.id)}" title="直播场次 ${escapeHtml(session)}">查看原始录屏</button><button type="button" class="clip-session-toggle" data-toggle-session="${escapeHtml(session)}" aria-label="${collapsed?'展开':'收起'}切片" title="${collapsed?'展开':'收起'}切片" aria-expanded="${!collapsed}" aria-controls="${gridId}">${collapsed?'⌄':'⌃'}</button></header><div class="clip-card-grid clip-editor-grid" id="${gridId}"${collapsed?' hidden':''}>${cards}</div></section>`;
 }).join('');
 return `<div class="clip-card-library" aria-label="成片卡片列表">${groups||'<div class="highlight-empty" role="status">暂无符合条件的成片，请调整筛选条件</div>'}</div>`;
}
let highlightFilterDrawerOpen=false;
let historyFilterDrawerOpen=false;
function readHighlightFilterInputs(){highlightClipFilters={productId:$('#hlClipProduct').value,hostName:$('#hlClipHost').value.trim(),publishStatus:$('#hlClipPublish').value}}
function mountHighlightFilterDrawer(){
 const filters=$('.highlight-clip-filters'),header=$('.highlight-auto-head');
 const drawer=document.createElement('section');drawer.id='highlightFilterDrawer';drawer.className='highlight-filter-drawer';drawer.setAttribute('role','region');drawer.setAttribute('aria-labelledby','highlightFilterToggle');
 filters.before(drawer);drawer.append(filters);
 const count=Object.values(highlightClipFilters).filter(Boolean).length;
 const toggle=document.createElement('button');toggle.type='button';toggle.id='highlightFilterToggle';toggle.className='highlight-filter-toggle'+(count?' has-filters':'');toggle.setAttribute('aria-controls',drawer.id);
 toggle.innerHTML='<span class="highlight-filter-label">搜索</span><span class="highlight-filter-count"'+(count?'':' hidden')+' aria-label="已生效 '+count+' 项筛选">'+count+'</span><span class="highlight-filter-chevron" aria-hidden="true">⌄</span>';
 header.append(toggle);
 const setOpen=open=>{highlightFilterDrawerOpen=open;drawer.hidden=!open;toggle.setAttribute('aria-expanded',String(open));toggle.querySelector('.highlight-filter-label').textContent=open?'收起搜索':'搜索';toggle.title=open?'收起搜索条件':count?'展开搜索，已有 '+count+' 项条件生效':'展开搜索条件'};
 setOpen(highlightFilterDrawerOpen);
 toggle.onclick=()=>setOpen(!highlightFilterDrawerOpen);
 drawer.onkeydown=event=>{if(event.key==='Escape'){event.preventDefault();setOpen(false);toggle.focus()}};
}
function mountHighlightView(list){
 const head=document.createElement('div');head.className='highlight-results-head';head.innerHTML=`<div class="highlight-view-switch" role="group" aria-label="展示方式"><button type="button" data-highlight-view="list" aria-pressed="${highlightViewMode==='list'}">列表展示</button><button type="button" data-highlight-view="card" aria-pressed="${highlightViewMode==='card'}">卡片展示</button></div>`;$('.highlight-clip-filters').after(head);
 if(highlightViewMode==='card'){
  $('.highlight-library-table').outerHTML=renderHighlightCards(list);
  mountInlineClipEditors();
  if(highlightBatchMode){const label=document.createElement('label');label.className='clip-card-select-all';label.innerHTML='<input class="highlight-select" id="highlightSelectAll" type="checkbox" aria-label="全选当前视频">全选当前视频';$('.highlight-batch-toolbar').prepend(label)}
 }
 if(highlightViewMode==='list'&&visibleUncutMaterialTasks().length){const pending=document.createElement('div');pending.className='pending-source-sessions';pending.innerHTML=renderHighlightCards([]);$('.highlight-library-table').after(pending)}
 head.querySelectorAll('[data-highlight-view]').forEach(button=>button.onclick=()=>{if(highlightViewMode===button.dataset.highlightView)return;readHighlightFilterInputs();highlightViewMode=button.dataset.highlightView;try{localStorage.setItem('live-slice-prototype-copy:highlight-view',highlightViewMode)}catch{}renderHighlight();$('[data-highlight-view="'+highlightViewMode+'"]').focus()});
}
let studioMaterialId='131';
function studioClipStatus(item){
 if(item.published)return{label:'发布成功',cls:'ok'};
 return (Number(item.task.id)+item.index)%3===0?{label:'已发布',cls:'done'}:{label:'待发布',cls:'wait'};
}
function studioSourceDuration(task){const n=Number(task.id)||0;const m=13+(n%5),sec=(n*7)%60;return String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0')}
function studioClipDuration(item){const sec=parseInt(String(item.duration||''),10);if(isNaN(sec))return String(item.duration||'');return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}
function studioClipLabel(item){return '切片 '+String(item.index+1).padStart(2,'0')}
function studioGroups(){return [...highlightTasks].sort((a,b)=>b.created.localeCompare(a.created)).map((task,idx)=>({task,order:idx+1,clips:allHighlightClips().filter(item=>item.task.id===task.id)}))}
function renderStudioClipCard(item){
 const st=studioClipStatus(item);
 return `<div class="sg-clip">
  <button type="button" class="sg-clip-card" data-preview-clip="${item.index}" data-preview-task="${escapeHtml(item.task.id)}" title="${escapeHtml(studioClipLabel(item))} · ${st.label}" aria-label="预览 ${escapeHtml(studioClipLabel(item))}，打开视频预览与字幕编辑">
   <span class="sg-clip-cover"><img src="${escapeHtml(clipCover(item))}" alt=""><span class="sg-clip-status ${st.cls}">${st.label}</span><span class="sg-clip-play" aria-hidden="true">▶</span><span class="sg-clip-duration">${escapeHtml(studioClipDuration(item))}</span></span>
  </button>
  <button type="button" class="sg-clip-dl" data-download-clip="${item.index}" data-task="${escapeHtml(item.task.id)}" title="下载 ${escapeHtml(studioClipLabel(item))}" aria-label="下载 ${escapeHtml(studioClipLabel(item))}">↓</button>
 </div>`;

const hostManagementStorageKey='live-slice-prototype:host-management';
let hostManagementLoaded=false,hostManagementLoadError=false;
function ensureHostManagementLoaded(){
 if(hostManagementLoaded)return;
 hostManagementLoaded=true;hostManagementLoadError=false;
 const normalize=account=>({...clonePresetData(account),platform:String(account.platform||'').trim(),name:String(account.name||'').trim(),alias:String(account.alias||'').trim(),realName:String(account.realName||'').trim(),socialAccountName:String(account.socialAccountName||'').trim()});
 try{
  const raw=localStorage.getItem(hostManagementStorageKey);
  if(raw!==null){const value=JSON.parse(raw);if(!Array.isArray(value?.accounts)||!value.accounts.every(account=>account&&typeof account==='object'&&account.name))throw new Error('Invalid host data');hostState.accounts=value.accounts.map(normalize);return}
  // Merge legacy per-preset accounts once; retain every old storage entry as a recovery copy.
  const keys=new Set([...$('#presetSelect').options].map(option=>presetStorageKey(option.value,'host')));
  for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i);if(key?.startsWith('live-slice-prototype:preset:')&&key.endsWith(':host'))keys.add(key)}
  const accounts=new Map();
  for(const key of keys){
   let state;try{state=JSON.parse(localStorage.getItem(key)||'null')}catch{continue}
   const legacy=Array.isArray(state?.accounts)?state.accounts:state?.account?.name?[state.account]:[];
   for(const account of legacy){
    if(!account||typeof account!=='object'||!account.name)continue;
    const value=normalize(account),identity=JSON.stringify([value.platform,value.name]);
    if(!accounts.has(identity))accounts.set(identity,value);
    else{const existing=accounts.get(identity);for(const [field,content] of Object.entries(value))if(!existing[field]&&content)existing[field]=content}
   }
  }
  hostState.accounts=[...accounts.values()];
  try{localStorage.setItem(hostManagementStorageKey,JSON.stringify({version:1,accounts:hostState.accounts}))}catch{toast('主播资料已读取，但独立保存失败；旧资料仍保留，请检查本地存储权限')}
 }catch{hostManagementLoadError=true}
}

 const next=clonePresetData(accounts);
 try{localStorage.setItem(hostManagementStorageKey,JSON.stringify({version:1,accounts:next}))}catch{toast('主播账号保存失败，请检查浏览器的本地存储权限');return false}

}

  q('#clipPublishForm').onsubmit = event => {
    event.preventDefault(); if (!addTopic()) return; collect();
    const titleError = !draft.title.trim() ? '请输入视频标题。' : '';
    const channelError = !draft.channels.length ? '请至少选择一个发布渠道。' : '';
    const timingError = draft.timing === 'scheduled' && (!draft.scheduledAt || !Number.isFinite(new Date(draft.scheduledAt).getTime()) || new Date(draft.scheduledAt).getTime() <= Date.now()) ? '请选择晚于当前时间的发布时间。' : '';
    q('#publishTitleError').textContent = titleError; q('#publishChannelError').textContent = channelError; q('#publishTimingError').textContent = timingError;
    q('#publishTitle').setAttribute('aria-invalid',String(!!titleError));q('#publishChannels').setAttribute('aria-invalid',String(!!channelError));q('#publishScheduledAt').setAttribute('aria-invalid',String(!!timingError));
    if (titleError || channelError || timingError) { (titleError ? q('#publishTitle') : channelError ? q('[name="publishChannel"]') : q('#publishScheduledAt')).focus(); return; }
    const oldSubmittedAt = draft.submittedAt, oldSubmission = draft.submission;
    draft.submittedAt = new Date().toLocaleString('sv-SE');
    draft.submission = {title:draft.title,channels:[...draft.channels],timing:draft.timing,scheduledAt:draft.scheduledAt,productId:draft.productId};
    if (!save(true)) { if (oldSubmittedAt) draft.submittedAt = oldSubmittedAt; else delete draft.submittedAt; if(oldSubmission)draft.submission=oldSubmission;else delete draft.submission; return; }
    syncDemoPublishRecord(item,draft);
    q('#publishStatus').textContent = draft.timing === 'scheduled' ? '定时发布演示已记录。不会在后台执行真实发布。' : '发布演示已记录，可在发布记录中查看。未提交到真实平台。';
    q('#publishStatus').scrollIntoView({block:'nearest'});
    toast('已完成发布演示');
  };
  drawProduct();drawTopics();drawCovers();
  if (draft.submittedAt) showStatus('这条视频已有本地发布演示记录，可继续修改配置。');
  window.scrollTo(0,0);q('#clipPublishTitle').focus({preventScroll:true});
}

// Restore only this prototype's local demonstrations; never contact the live site.
for (const item of allHighlightClips()) {
  const draft = readClipPublishDraft(item);
  if (draft.submittedAt) syncDemoPublishRecord(item,draft);
}
document.addEventListener('clip-subtitles-saved', event => {
  const current = currentClipPublish;
  if (!current || active !== 'publish' || String(current.item.task.id) !== String(event.detail.taskId) || current.item.index !== event.detail.index) return;

});
