 const mask=document.createElement('div');mask.className='lex-mask';
 const poolName=pool==='hot'?'热词':'违禁词';
 const radioHtml=lockPool?'':`<div style="display:flex;gap:16px;margin-bottom:14px"><label><input type="radio" name="pooldest" value="hot" ${pool==='hot'?'checked':''}> 热词池</label><label><input type="radio" name="pooldest" value="forbidden" ${pool==='forbidden'?'checked':''}> 违禁词池</label></div>`;
 mask.innerHTML=`<div class="lex-dialog"><h4>添加${lockPool?poolName:'词条'}</h4>${radioHtml}<input id="lxInput" maxlength="30" placeholder="请输入${lockPool?poolName:'词条'}名称"><div class="row"><button class="lex-btn ghost" id="lxCancel">取消</button><button class="lex-btn solid" id="lxOk">确定</button></div></div>`;
 document.body.appendChild(mask);
 const input=mask.querySelector('#lxInput');input.focus();
 mask.querySelector('#lxCancel').onclick=()=>mask.remove();
 mask.onclick=e=>{if(e.target===mask)mask.remove()};
 const save=()=>{const v=input.value.trim();if(!v){toast('请输入内容');return;}const target=lockPool?pool:mask.querySelector('input[name="pooldest"]:checked').value;const list=target==='hot'?lexiconState.hotWords:lexiconState.forbiddenWords;if(list.includes(v)){toast('该词已存在于'+(target==='hot'?'热词池':'违禁词池'));return;}const totalLen=lexiconState.hotWords.join('').length+lexiconState.forbiddenWords.join('').length+v.length;if(totalLen>340){toast('超出340个字符上限');return;}list.push(v);mask.remove();toast('已添加到'+(target==='hot'?'热词池':'违禁词池'));renderLexicon(root);};
 mask.querySelector('#lxOk').onclick=save;
 input.onkeydown=e=>{if(e.key==='Enter')save();};
}
const presetDrafts={};
const presetInitialStates={edit:JSON.parse(JSON.stringify(editorState)),lexicon:JSON.parse(JSON.stringify(lexiconState))};
let displayedPresetName=null,presetViewMode='base';
const presetTabNames={base:'切片策略',edit:'剪辑预设',lexicon:'词库管理'};
function presetStorageKey(name,mode){return 'live-slice-prototype:preset:'+name+':'+mode}
function clonePresetData(value){return JSON.parse(JSON.stringify(value))}
function readSavedPreset(name,mode){try{return JSON.parse(localStorage.getItem(presetStorageKey(name,mode))||'null')}catch{return null}}
function capturePresetDraft(){
 if(!displayedPresetName||!$('.preset-form'))return;
 let value;
 if(presetViewMode==='base'){
  if(!$('.preset-strategy'))return;
  const selectedIndex=selector=>$$(selector+' button').findIndex(b=>b.classList.contains('on'));
  value={strategy:selectedIndex('.preset-strategy'),quantity:selectedIndex('.preset-pills'),ratio:selectedIndex('.preset-ratios'),filters:$$('.preset-checks input').map(input=>input.checked),radios:{}};
  ['ps','reuse','pv'].forEach(name=>{value.radios[name]=$$('input[name="'+name+'"]').findIndex(input=>input.checked)});
 }else if(presetViewMode==='edit'){if(!$('#editorHost'))return;value=editorState}
 else{if(!$('#lexiconHost'))return;value={hotWords:lexiconState.hotWords,forbiddenWords:lexiconState.forbiddenWords}}
 const drafts=presetDrafts[displayedPresetName]||(presetDrafts[displayedPresetName]={});drafts[presetViewMode]=clonePresetData(value);
}
function restorePresetTab(name,mode){
 const value=presetDrafts[name]?.[mode]||readSavedPreset(name,mode);
 if(mode==='base'){
  if(!value)return;
  [['.preset-strategy','strategy'],['.preset-pills','quantity'],['.preset-ratios','ratio']].forEach(([selector,key])=>$$(selector+' button').forEach((b,i)=>b.classList.toggle('on',i===value[key])));
  $$('.preset-checks input').forEach((input,i)=>input.checked=value.filters[i]);
  ['ps','reuse','pv'].forEach(key=>$$('input[name="'+key+'"]').forEach((input,i)=>input.checked=i===value.radios[key]));
 }else if(mode==='edit'){Object.assign(editorState,clonePresetData(value||presetInitialStates.edit))}
 else{Object.assign(lexiconState,clonePresetData(presetInitialStates.lexicon),clonePresetData(value||{}));lexiconState.query=''}
}
function saveCurrentPresetTab(){
 capturePresetDraft();const value=presetDrafts[displayedPresetName]?.[presetViewMode];if(!value)return;
 try{localStorage.setItem(presetStorageKey(displayedPresetName,presetViewMode),JSON.stringify(value));toast('已保存「'+displayedPresetName+'」的'+presetTabNames[presetViewMode])}
 catch{toast('保存失败，请检查浏览器的本地存储权限')}
}
function bindPresetActions(){
 const saveBtn=$('#btnSavePreset');if(saveBtn)saveBtn.onclick=saveCurrentPresetTab;
 const defBtn=$('#btnSetDefault');if(defBtn)defBtn.onclick=()=>{const name=$('#presetSelect').value;try{localStorage.setItem('live-slice-prototype:default-preset',name);currentDefaultPreset=name;toast('已将「'+name+'」设为默认预设');updateDefaultButton()}catch{toast('默认预设保存失败，请检查浏览器的本地存储权限')}};
 updateDefaultButton();
}
function wirePreset(mode){
 const hero=$('.preset-hero');if(!hero)return;hero.querySelector('h1').textContent='店铺预设';hero.querySelector('p')?.remove();$('.preset-modes')?.remove();
 $$('.preset-tabs button').forEach((b,i)=>{b.textContent=['切片策略','剪辑预设','词库管理'][i];b.classList.toggle('on',(mode==='edit'?1:mode==='lexicon'?2:0)===i);b.onclick=()=>openPreset(i===0?'base':i===1?'edit':'lexicon')});
 $$('.preset-pills button,.preset-strategy button,.preset-ratios button').forEach(b=>b.onclick=()=>{b.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on')});
}
function openPreset(mode){
 capturePresetDraft();active='preset';presetViewMode=mode;displayedPresetName=$('#presetSelect').value;
 $$('[data-tab]').forEach(x=>x.classList.toggle('active',x.dataset.tab==='preset'));$('#crumb').textContent='店铺预设';
 $('#presetSetting').hidden=false;$('#presetSelect').onchange=()=>openPreset(presetViewMode);
 $('#panel').innerHTML=renderPreset();wirePreset(mode);restorePresetTab(displayedPresetName,mode);
 const form=$('.preset-form');
 if(mode==='edit'||mode==='lexicon'){
  form.style.maxWidth='none';form.style.padding='0';
  form.innerHTML=(mode==='edit'?'<div id="editorHost"></div>':'<div id="lexiconHost"></div>')+'<div class="preset-actions preset-tab-actions"><button class="primary-preset" id="btnSavePreset">保存预设</button></div>';
  if(mode==='edit')mountEditor($('#editorHost'));else renderLexicon($('#lexiconHost'));
 }
 bindPresetActions();
}
try{const savedDefault=localStorage.getItem('live-slice-prototype:default-preset');if([...$('#presetSelect').options].some(option=>option.value===savedDefault))currentDefaultPreset=savedDefault}catch{}

$$('[data-tab]').forEach(b=>b.onclick=()=>{if(b.dataset.tab==='preset'){openPreset('base');return}render(b.dataset.tab)});$('#switch').onclick=()=>toast('店铺切换面板已打开');$('#selfCheck').onclick=()=>toast('新店自检已打开');preset.addEventListener('click',()=>openPreset('base'));render('highlight');
</script></body></html>
