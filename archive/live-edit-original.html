<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>模力视频 · 直播精剪原型</title>
<style>
  /* Sidebar removed for focused page-design work */
  .sidebar{display:none!important}
  .topbar{padding-left:42px}
  .content{max-width:1440px;padding-left:52px;padding-right:52px}
  @media(max-width:680px){.topbar{padding-left:18px}.content{padding-left:14px;padding-right:14px}}
</style>
<style>
:root{--bg:#f7f8fc;--surface:#fff;--ink:#17151f;--muted:#777487;--line:#eceaf2;--purple:#a765ef;--purple2:#d76df1;--soft:#f4eaff;--green:#2eaa70;--shadow:0 10px 28px rgba(57,26,87,.07)}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);font-size:14px}button,input,select{font:inherit}button{cursor:pointer;border:0;background:none;color:inherit}.app{display:flex;min-height:100vh}.sidebar{width:172px;background:#fff;border-right:1px solid var(--line);padding:15px 13px;flex:none}.brand{display:flex;align-items:center;gap:9px;padding:0 7px 20px;font-weight:700}.brand-mark{width:24px;height:24px;border-radius:8px;background:linear-gradient(135deg,#ff7dba,#9c5bf5);color:#fff;display:grid;place-items:center;font-size:12px}.brand small{display:block;color:#fff;background:#8d57c8;border-radius:3px;padding:2px 5px;font-size:9px;margin-top:2px;width:max-content}.workspace{display:flex;align-items:center;gap:8px;padding:7px 8px;margin-bottom:12px;font-weight:600}.workspace .mark{width:18px;height:18px;border-radius:50%;background:linear-gradient(135deg,#ff7dba,#9c5bf5)}.group{margin:14px 0}.group-title{display:flex;justify-content:space-between;align-items:center;color:#222;font-weight:600;padding:8px 8px}.group-title span:last-child{color:#9b98a4;font-size:12px}.nav-item{display:block;width:100%;text-align:left;padding:8px 12px;border-radius:7px;color:#4c4856;margin:2px 0}.nav-item:hover,.nav-item.active{background:#f3e9fb;color:#944ee7;font-weight:600}.bottom-nav{position:absolute;bottom:16px;width:145px;border-top:1px solid var(--line);padding-top:12px}.bottom-nav .nav-item{padding-left:8px}.main{flex:1;min-width:0}.topbar{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px}.top-title{font-size:18px;font-weight:700}.user{display:flex;align-items:center;gap:10px;color:#4b4854}.avatar{width:29px;height:29px;border-radius:50%;background:#f2e6ff;color:#9c59dc;display:grid;place-items:center;font-weight:700}.content{padding:25px 38px 50px;max-width:1320px;margin:auto}.hero{text-align:center;margin:8px 0 26px}.hero h1{font-size:31px;letter-spacing:1px;margin:0 0 8px;font-weight:800}.hero p{color:var(--muted);margin:0}.mode-switch{margin:26px auto 26px;background:#fff;border-radius:13px;box-shadow:var(--shadow);display:flex;width:500px;max-width:100%;padding:5px}.mode-switch button{flex:1;padding:13px 18px;border-radius:10px;font-weight:600;color:#55505f}.mode-switch button.active{background:linear-gradient(100deg,#ad65ed,#de6fee);color:#fff}.workspace-card{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 4px 18px rgba(49,30,69,.04)}.tabs{display:flex;border-bottom:1px solid var(--line);padding:0 22px}.tab{padding:17px 22px 15px;font-weight:600;color:#696573;position:relative}.tab.active{color:#a356e7}.tab.active:after{content:"";position:absolute;left:18px;right:18px;bottom:-1px;height:3px;border-radius:3px;background:#bf6bef}.panel{padding:31px 60px 35px;max-width:900px;margin:auto}.field{margin-bottom:25px}.label{display:flex;align-items:center;gap:3px;font-weight:700;margin-bottom:10px}.required{color:#f05575}.select{height:42px;border:1px solid #dedbe6;border-radius:7px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;color:#aaa;transition:.2s}.select:hover{border-color:#b66ae9}.select.open{border-color:#a863ed;box-shadow:0 0 0 3px #f3e9fd}.chev{width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:7px solid #aaa}.dropdown{border:1px solid var(--line);border-radius:8px;background:#fff;box-shadow:var(--shadow);padding:12px;margin-top:6px;display:none}.dropdown.show{display:block}.empty{padding:16px;text-align:center;color:#999}.empty b{display:block;color:#5a5565;font-weight:600;margin-bottom:5px}.link{color:#a356e7;font-weight:600}.checks{display:flex;align-items:center;gap:18px;flex-wrap:wrap}.check{display:flex;align-items:center;gap:6px;color:#555}.check input{accent-color:#15131a}.stepper{display:inline-flex;align-items:center;border:1px solid #e3e0e8;border-radius:6px;height:28px;margin-left:-9px}.stepper button{width:25px;color:#8e8997}.stepper span{min-width:43px;text-align:center;color:#56515e;font-size:12px}.pills{display:flex;gap:12px;flex-wrap:wrap}.pill{width:76px;height:32px;background:#f5f4f8;border-radius:5px;display:grid;place-items:center;color:#5c5864}.pill.selected{background:#fff;border:2px solid #bc67ec;color:#8e46cb}.strategy{display:grid;grid-template-columns:1fr 1fr;gap:15px}.strategy-card{border:1px solid #dedbe6;border-radius:8px;padding:16px;min-height:72px;text-align:left}.strategy-card.selected{border:2px solid #b966e9;background:#fbf4ff}.strategy-card strong{display:block;font-size:14px;margin-bottom:6px}.strategy-card small{color:#716c79;line-height:1.45}.radio-row{display:flex;gap:20px;align-items:center;flex-wrap:wrap}.radio-row label{display:flex;align-items:center;gap:6px;color:#555}.radio-row input{accent-color:#9d57e1}.ratio-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.ratio{border:1px solid #e5e1ea;border-radius:8px;padding:12px 10px;min-height:80px}.ratio.selected{border-color:#b762ea;background:#fbf3ff}.ratio strong{display:block;font-size:14px}.ratio small{display:block;color:#85818e;margin-top:6px;font-size:11px;line-height:1.35}.actions{display:flex;justify-content:flex-end;margin-top:30px}.primary{background:linear-gradient(100deg,#aa61e9,#dc6deb);color:#fff;border-radius:7px;padding:11px 30px;font-weight:700;box-shadow:0 7px 16px rgba(172,92,231,.24)}.secondary{border:1px solid #e0dce7;border-radius:7px;padding:10px 22px;margin-right:10px}.management{display:none;padding:30px}.management.show{display:block}.table{border:1px solid var(--line);border-radius:10px;overflow:hidden}.table-head,.table-row{display:grid;grid-template-columns:1.2fr 1fr 1fr 120px;gap:12px;padding:14px 18px;align-items:center}.table-head{background:#faf9fc;color:#777;font-size:12px}.table-row{border-top:1px solid var(--line)}.status{color:var(--green);font-size:12px}.toast{position:fixed;right:28px;bottom:28px;background:#26212f;color:#fff;border-radius:9px;padding:13px 18px;box-shadow:var(--shadow);opacity:0;transform:translateY(8px);transition:.25s}.toast.show{opacity:1;transform:translateY(0)}.modal{position:fixed;inset:0;background:rgba(25,18,35,.3);display:none;place-items:center}.modal.show{display:grid}.modal-card{background:#fff;border-radius:12px;width:420px;padding:24px;box-shadow:0 20px 60px rgba(32,16,48,.2)}.modal-card h3{margin:0 0 16px}.modal-card input{width:100%;height:40px;border:1px solid #dedbe6;border-radius:7px;padding:0 11px}.modal-actions{display:flex;justify-content:flex-end;margin-top:20px;gap:10px}@media(max-width:900px){.sidebar{width:145px}.panel{padding:28px 28px}.ratio-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:680px){.sidebar{display:none}.topbar{padding:0 18px}.content{padding:20px 14px}.strategy{grid-template-columns:1fr}.panel{padding:24px 18px}.table-head,.table-row{grid-template-columns:1fr 1fr}.table-head div:nth-child(n+3),.table-row div:nth-child(n+3){display:none}}
</style>
</head>
<body>
<div class="app">
 <aside class="sidebar">
  <div class="brand"><div class="brand-mark">模</div><div>祈飞-索子<small>团队管理员</small></div></div>
  <div class="workspace"><span class="mark"></span>祈飞</div>
  <div class="group"><div class="group-title">我的资产 <span>⌄</span></div><button class="nav-item">AI素材库</button><button class="nav-item">项目管理</button><button class="nav-item">我的收藏</button><button class="nav-item">资源库</button></div>
  <div class="group"><div class="group-title">创作工具 <span>⌄</span></div><button class="nav-item">模力Agent</button><button class="nav-item">脚本剪</button><button class="nav-item">照着剪</button><button class="nav-item">批量精剪</button><button class="nav-item active">直播精剪</button><button class="nav-item">视频翻译</button><button class="nav-item">随心混剪</button><button class="nav-item">裂变神器</button><button class="nav-item">字幕擦除</button><button class="nav-item">云剪辑</button><button class="nav-item">视频模板</button></div>
  <div class="group"><div class="group-title">运营管理 <span>⌄</span></div><button class="nav-item">数据看板</button><button class="nav-item">数据明细</button><button class="nav-item">使用数据</button></div>
  <div class="bottom-nav"><button class="nav-item">◌ 客服</button><button class="nav-item">▱ 教程</button></div>
 </aside>
 <main class="main">
  <!-- 顶部产品/用户模块已移除，保留直播精剪内容区 -->
  <div class="content">
   <section class="hero"><h1>直播精剪</h1><p>智能直播拆条 + 配方短视频自动化剪辑</p></section>
   <div class="mode-switch"><button data-mode="anchor">♙ 主播管理</button><button class="active" data-mode="cut">▣ 直播拆条</button><button data-mode="create">▶ 视频创作</button></div>
   <section class="workspace-card">
    <div class="tabs"><button class="tab active" data-tab="createTask">创建任务</button><button class="tab" data-tab="taskManage">任务管理</button></div>
    <div id="createTask" class="panel">
     <div class="field"><div class="label">主播名称</div><div class="select" id="anchorSelect">请选择主播名称 <span class="chev"></span></div><div class="dropdown" id="anchorDropdown"><div class="empty"><b>您还未添加主播信息</b><span>添加主播信息可以优化拆条结果，和成片剪辑效果</span><br><button class="link" id="addAnchor">去添加</button></div></div></div>
     <div class="field"><div class="label">选择直播视频<span class="required">*</span></div><div class="select" id="videoSelect">请选择已完成拆条任务的直播视频 <span class="chev"></span></div><div class="dropdown" id="videoDropdown"><div class="empty"><b>暂无可用直播视频</b><span>请先完成直播拆条任务</span></div></div></div>
     <div class="field"><div class="label">无效词过滤</div><div class="checks"><label class="check"><input type="checkbox" checked>重复词</label><label class="check"><input type="checkbox" checked>语气词</label><label class="check"><input type="checkbox" checked>停顿</label><span class="stepper"><button>−</button><span>0.8s</span><button>＋</button></span><label class="check"><input type="checkbox">违禁词</label><button class="link">去管理</button></div></div>
     <div class="field"><div class="label">输出数量<span class="required">*</span></div><div class="pills" id="countPills"><button class="pill">1</button><button class="pill">2</button><button class="pill selected">3</button><button class="pill">4</button><button class="pill">5</button><button class="pill">6</button></div></div>
     <div class="field"><div class="label">成片生成策略<span class="required">*</span></div><div class="strategy"><button class="strategy-card selected"><strong>更多成片</strong><small>按设定数量输出视频，片段不足时，复用片段</small></button><button class="strategy-card"><strong>差异性更大</strong><small>限制每个片段的使用次数，成片数可能少于设定输出数量</small></button></div></div>
     <div class="field"><div class="label">标签相似度过滤 <span style="color:#aaa;font-weight:400">ⓘ</span></div><div class="radio-row"><label><input type="radio" name="sim">宽松</label><label><input type="radio" name="sim">标准</label><label><input type="radio" name="sim" checked>严格</label></div></div>
     <div class="field"><div class="label">成片变速</div><div class="radio-row"><label><input type="radio" name="speed">0.8</label><label><input type="radio" name="speed">1.0</label><label><input type="radio" name="speed" checked>1.2</label><label><input type="radio" name="speed">1.5</label><label><input type="radio" name="speed">2.0</label><label><input type="radio" name="speed">其他</label></div></div>
     <div class="field"><div class="label">输出比例<span class="required">*</span></div><div class="ratio-grid"><button class="ratio selected"><strong>9:16</strong><small>1080 × 1920<br>适合抖音快手淘宝逛逛平台</small></button><button class="ratio"><strong>3:4</strong><small>750 × 1000<br>适合淘宝主图&微详情视频</small></button><button class="ratio"><strong>1:1</strong><small>800 × 800<br>适合淘宝主图&微详情视频</small></button><button class="ratio"><strong>16:9</strong><small>1920 × 1080<br>适合淘宝详情页短视频</small></button></div></div>
     <div class="actions"><button class="secondary" id="previewBtn">预览配置</button><button class="primary" id="createBtn">确认创建</button></div>
    </div>
    <div id="taskManage" class="management"><div class="table"><div class="table-head"><div>任务名称</div><div>创建时间</div><div>状态</div><div>操作</div></div><div class="table-row"><div>直播精剪示例任务</div><div>2026-10-09 15:32</div><div class="status">已完成</div><div><button class="link">查看</button></div></div><div class="table-row"><div>暂无更多任务</div><div>—</div><div>—</div><div>—</div></div></div></div>
   </section>
  </div>
 </main>
</div>
<div class="toast" id="toast" aria-live="polite"></div>
<div class="modal" id="modal"><div class="modal-card"><h3>添加主播信息</h3><input id="anchorName" placeholder="请输入主播名称"/><div class="modal-actions"><button class="secondary" id="cancelModal">取消</button><button class="primary" id="saveAnchor">保存主播</button></div></div></div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
$('#anchorSelect').onclick=()=>{$('#anchorDropdown').classList.toggle('show');$('#videoDropdown').classList.remove('show')};
$('#videoSelect').onclick=()=>{$('#videoDropdown').classList.toggle('show');$('#anchorDropdown').classList.remove('show')};
$('#addAnchor').onclick=e=>{e.stopPropagation();$('#modal').classList.add('show');$('#anchorDropdown').classList.remove('show');$('#anchorName').focus()};
$('#cancelModal').onclick=()=>$('#modal').classList.remove('show');
$('#saveAnchor').onclick=()=>{const n=$('#anchorName').value.trim();if(!n){toast('请输入主播名称');return}$('#anchorSelect').firstChild.textContent=n+' ';$('#modal').classList.remove('show');toast('主播信息已添加')};
$('#countPills').onclick=e=>{if(e.target.classList.contains('pill')){$$('.pill').forEach(x=>x.classList.remove('selected'));e.target.classList.add('selected')}};
$$('.strategy-card').forEach(b=>b.onclick=()=>{$$('.strategy-card').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')});
$$('.ratio').forEach(b=>b.onclick=()=>{$$('.ratio').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')});
$$('.tab').forEach(b=>b.onclick=()=>{ $$('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#createTask').style.display=b.dataset.tab==='createTask'?'block':'none';$('#taskManage').classList.toggle('show',b.dataset.tab==='taskManage')});
$$('[data-mode]').forEach(b=>b.onclick=()=>{ $$('[data-mode]').forEach(x=>x.classList.remove('active'));b.classList.add('active');toast(b.dataset.mode==='anchor'?'主播管理模块已切换':b.dataset.mode==='cut'?'直播拆条模块已切换':'视频创作模块已切换')});
$('#previewBtn').onclick=()=>toast('已生成当前配置预览');
$('#createBtn').onclick=()=>toast('请先选择主播和直播视频');
document.addEventListener('click',e=>{if(!e.target.closest('.field')){$('#anchorDropdown').classList.remove('show');$('#videoDropdown').classList.remove('show')}});
</script>
</body></html>
